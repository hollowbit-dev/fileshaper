<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' fileshaper:; img-src 'self' fileshaper: blob: data:; media-src fileshaper: blob:; script-src 'self' fileshaper:; style-src 'self' 'unsafe-inline'; worker-src 'self' fileshaper: blob:; connect-src fileshaper: blob: data:; font-src 'self' fileshaper: data:">
  <title>Fileshaper</title>
  <link rel="stylesheet" href="app.css">
  <script src="../../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="drag"></div>
      <div class="brand">
        <img src="../../assets/icon.png" alt="" class="brand-icon">
        <div>
          <div class="brand-name">Fileshaper</div>
          <div class="brand-sub">by Hollowbit</div>
        </div>
      </div>
      <button class="search-btn" id="open-palette" title="Search actions">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
        Search actions <kbd id="kbd-hint">⌘K</kbd>
      </button>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="support-btn" data-go="support">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-8.8-8.7C1.9 8 4 4.8 7.2 4.8c1.9 0 3.4 1 4.8 2.8 1.4-1.8 2.9-2.8 4.8-2.8 3.2 0 5.3 3.2 4 6.5C19 15.7 12 20 12 20z"/></svg>
          Support Fileshaper
        </button>
        <div class="offline-pill"><span class="dot"></span>Offline. Nothing is uploaded.</div>
      </div>
    </aside>
    <main id="main"><div class="titlebar"></div><div id="view"></div></main>
  </div>
  <div id="drop-overlay"><div class="drop-card"><div class="drop-title">Drop to open in Fileshaper</div><div class="drop-sub">Video, images, PDF or audio</div></div></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
